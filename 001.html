function reorderNoConsecutiveAnswers(list) {
    let arr = [...list];
    for (let i = 0; i < arr.length - 1; i++) {
        let currentAns = Array.isArray(arr[i].a) ? arr[i].a[0] : arr[i].a;
        let nextAns = Array.isArray(arr[i+1].a) ? arr[i+1].a[0] : arr[i+1].a;
        if (currentAns === nextAns) {
            for (let j = i + 2; j < arr.length; j++) {
                let futureAns = Array.isArray(arr[j].a) ? arr[j].a[0] : arr[j].a;
                if (futureAns !== currentAns) {
                    let temp = arr[i+1]; arr[i+1] = arr[j]; arr[j] = temp;
                    break;
                }
            }
        }
    }
    return arr;
}

function validateLogin() {
    player.classStr = document.getElementById('student-class').value.trim();
    player.noStr = document.getElementById('student-no').value.trim();
    player.nameStr = document.getElementById('student-name').value.trim();

    if (!player.classStr || !player.noStr || !player.nameStr) {
        alert('請完整填寫班別、學號與姓名！');
        return;
    }
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    
    currentQuestionList = reorderNoConsecutiveAnswers(rawQuestions);
    showQuestion();
}

function updateHPDisplay() {
    let hearts = '';
    for(let i=0; i<5; i++) hearts += (i < hp) ? '❤️' : '🖤';
    document.getElementById('hp-display').innerText = hearts;
    const darkness = (5 - hp) * 0.15;
    document.getElementById('damage-overlay').style.backgroundColor = `rgba(0, 0, 0, ${darkness})`;
}

function triggerFireworks(combo) {
    if (typeof confetti !== 'function') return;
    confetti({
        particleCount: Math.min(30 + combo * 25, 200),
        spread: Math.min(50 + combo * 15, 120),
        origin: { y: 0.6 }
    });
}

function showComboBanner(combo) {
    const banner = document.getElementById('combo-banner');
    if (combo > 1) {
        banner.innerText = `${combo} 連擊！`;
        banner.classList.add('show');
        setTimeout(() => banner.classList.remove('show'), 1200);
    }
}

function showQuestion() {
    if (currentIdx >= currentQuestionList.length) { endGame(true); return; }
    const q = currentQuestionList[currentIdx];
    document.getElementById('section-badge').innerText = q.section;
    document.getElementById('question-text').innerHTML = q.q + (q.source ? `<span class="source-tag">—— ${q.source}</span>` : '');
    document.getElementById('score').innerText = totalScore;

    if (q.type === 'fill') {
        document.getElementById('fill-area').classList.remove('hidden');
        document.getElementById('mc-area').classList.add('hidden');
        document.getElementById('user-answer').value = '';
    } else {
        document.getElementById('fill-area').classList.add('hidden');
        const mcArea = document.getElementById('mc-area');
        mcArea.classList.remove('hidden'); mcArea.innerHTML = '';
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'mc-option'; btn.innerText = opt;
            btn.onclick = () => checkMC(idx);
            mcArea.appendChild(btn);
        });
    }
}

function submitFillAnswer() {
    const userAns = document.getElementById('user-answer').value.trim();
    if (!userAns) return;
    const q = currentQuestionList[currentIdx];
    let isCorrect = Array.isArray(q.a) ? q.a.some(a => userAns.includes(a)) : userAns.includes(q.a);

    if (isCorrect) handleCorrect(q.score);
    else handleWrong(Array.isArray(q.a) ? q.a.join(' / ') : q.a);
}

function checkMC(idx) {
    const q = currentQuestionList[currentIdx];
    let expMsg = q.explanations ? "\n\n【解析】：\n" + q.explanations.map((exp, i) => `${i+1}. ${exp}`).join('\n') : '';
    if (idx === q.ansIndex) {
        alert("✅ 回答正確！" + expMsg); handleCorrect(q.score);
    } else {
        alert(`❌ 答錯了！正確答案是：${q.options[q.ansIndex]}` + expMsg); handleWrong(q.options[q.ansIndex]);
    }
}

function handleCorrect(score) {
    comboCount++;
    totalScore += score;
    triggerFireworks(comboCount);
    showComboBanner(comboCount);
    currentIdx++; showQuestion();
}

function handleWrong(correctAns) {
    comboCount = 0;
    hp--; updateHPDisplay();
    wrongQuestions.push(currentQuestionList[currentIdx]);

    if (currentQuestionList[currentIdx].type === 'fill') {
        alert('❌ 答錯了！正確答案是：' + correctAns);
    }
    if (hp <= 0) { endGame(false); } 
    else { currentIdx++; showQuestion(); }
}

function endGame(isWin) {
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = totalScore;
    document.getElementById('player-info-display').innerText = `玩家：${player.classStr} (${player.noStr}) ${player.nameStr}`;
    
    let title = "";
    if (attemptCount > 1) {
        title = "🛡️ 稱號：【百折不撓大賢者】 (挑戰次數：2次)";
    } else if (totalScore >= 72) {
        title = "🎓 稱號：【文言翰林院學士】 (極優)";
    } else if (totalScore >= 45) {
        title = "🌲 稱號：【森林語言冒險家】 (良好)";
    } else {
        title = "🌱 稱號：【文言潛力新星】 (再接再厲)";
    }
    document.getElementById('user-title-display').innerText = title;

    let reportMsg = `已完成溫習！答對題目數：${currentQuestionList.length - wrongQuestions.length} / ${currentQuestionList.length}`;
    if (wrongQuestions.length > 0) {
        reportMsg += `<br><span style="color:#e74c3c;">還有 ${wrongQuestions.length} 道錯題需要再接再厲！</span>`;
        document.getElementById('retry-wrong-btn').style.display = 'block';
    } else {
        reportMsg += `<br><span style="color:#27ae60;">完美通關！所有題目皆已掌握！</span>`;
        document.getElementById('retry-wrong-btn').style.display = 'none';
    }
    document.getElementById('report-details').innerHTML = reportMsg;

    if (!isWin) document.getElementById('end-title').innerText = "💀 冒險中途陣亡 💀";
}

function startRetryMode() {
    if (wrongQuestions.length === 0) return;
    attemptCount++;
    currentQuestionList = reorderNoConsecutiveAnswers(wrongQuestions);
    wrongQuestions = [];
    currentIdx = 0; hp = 5;
    updateHPDisplay();
    document.getElementById('end-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    showQuestion();
}

function uploadScore() {
    const btn = document.getElementById('submit-score-btn');
    btn.disabled = true; document.getElementById('upload-status').innerText = "提交中...";

    fetch(WEB_APP_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: `${player.classStr} (${player.noStr}) ${player.nameStr}`, score: totalScore })
    }).then(() => {
        document.getElementById('upload-status').innerText = "✅ 成績已成功登記至 Google 試算表！";
        btn.style.display = 'none';
    }).catch(() => {
        document.getElementById('upload-status').innerText = "❌ 提交失敗，請檢查網絡。";
        btn.disabled = false;
    });
}
// 1. 替換為你的 Google Form 提交網址 (結尾必須是 /formResponse)
const GOOGLE_FORM_ACTION_URL = "https://docs.google.com/forms/d/e/你的表單ID/formResponse"; 

// 2. 填入步驟 1 取得的 entry ID
const FORM_ENTRIES = {
    class: "entry.123456789",   // 班別欄位 ID
    no: "entry.987654321",      // 學號欄位 ID
    name: "entry.112233445",    // 姓名欄位 ID
    score: "entry.556677889"    // 得分欄位 ID
};

function uploadScore() {
    const btn = document.getElementById('submit-score-btn');
    btn.disabled = true; 
    document.getElementById('upload-status').innerText = "提交中...";

    // 組成 FormData 格式
    const formData = new FormData();
    formData.append(FORM_ENTRIES.class, player.classStr);
    formData.append(FORM_ENTRIES.no, player.noStr);
    formData.append(FORM_ENTRIES.name, player.nameStr);
    formData.append(FORM_ENTRIES.score, totalScore);

    // 發送 POST 請求至 Google Form
    fetch(GOOGLE_FORM_ACTION_URL, {
        method: 'POST',
        mode: 'no-cors', // 避開 Google Forms 的跨網域 (CORS) 限制
        body: formData
    }).then(() => {
        document.getElementById('upload-status').innerText = "✅ 成績已成功自動登錄至 Google Form！";
        btn.style.display = 'none';
    }).catch((error) => {
        console.error('Error:', error);
        document.getElementById('upload-status').innerText = "❌ 提交失敗，請檢查網路連線。";
        btn.disabled = false;
    });
}
